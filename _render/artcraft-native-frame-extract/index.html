<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #101114;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #f2f1ee;
        background: #101114;
      }
      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .frame {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #101114;
      }
      .stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 50% 50%;
      }
      .stage img {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
      .hl {
        position: absolute;
        border: 3px solid #f2f1ee;
        border-radius: 10px;
        box-shadow: 0 0 0 4px rgba(242, 241, 238, 0.16);
        pointer-events: none;
        opacity: 0;
      }
      .pointer {
        position: absolute;
        width: 22px;
        height: 22px;
        background: #f2f1ee;
        clip-path: polygon(0 0, 0 100%, 32% 70%, 58% 100%, 70% 92%, 44% 62%, 100% 62%);
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.65));
        pointer-events: none;
        opacity: 0;
        z-index: 4;
      }
      .cap {
        position: absolute;
        left: 50%;
        bottom: 44px;
        transform: translateX(-50%);
        padding: 16px 28px;
        background: rgba(12, 13, 16, 0.92);
        border: 1px solid rgba(242, 241, 238, 0.18);
        border-radius: 10px;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
        white-space: nowrap;
        color: #f2f1ee;
        opacity: 0;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32"
      data-width="1920"
      data-height="1080"
    >
      <section id="s0" class="scene clip" data-start="0" data-duration="4.5" data-track-index="0">
        <div class="frame">
          <div class="stage" id="s0stage" data-layout-allow-overflow>
            <img src="assets/before.png" alt="Frame Extract coming soon" />
            <div class="hl" id="s0soon" style="left: 6px; top: 466px; width: 226px; height: 44px; border-radius: 8px;"></div>
          </div>
        </div>
      </section>

      <section id="s1" class="scene clip" data-start="4.5" data-duration="6" data-track-index="0">
        <div class="frame">
          <div class="stage" id="s1stage" data-layout-allow-overflow>
            <img src="assets/after-empty.png" alt="Select Video empty state" />
            <div class="hl" id="s1btn" style="left: 720px; top: 602px; width: 171px; height: 56px;"></div>
            <div class="pointer" id="s1ptr" style="left: 878px; top: 650px;"></div>
          </div>
        </div>
        <div class="cap" id="s1cap">Frame Extract, on this computer</div>
      </section>

      <section id="s2" class="scene clip" data-start="10.5" data-duration="7" data-track-index="0">
        <div class="frame">
          <div class="stage" id="s2stage" data-layout-allow-overflow>
            <img src="assets/loaded.png" alt="Preview and extraction settings" />
            <div class="hl" id="s2preview" style="left: 588px; top: 101px; width: 968px; height: 268px; border-radius: 6px;"></div>
            <div class="hl" id="s2settings" style="left: 588px; top: 488px; width: 968px; height: 348px; border-radius: 8px;"></div>
          </div>
        </div>
        <div class="cap" id="s2cap">Start time, count, and spacing</div>
      </section>

      <section id="s3" class="scene clip" data-start="17.5" data-duration="7" data-track-index="0">
        <div class="frame">
          <div class="stage" id="s3stage" data-layout-allow-overflow>
            <img src="assets/after.png" alt="Extracted stills grid" />
            <div class="hl" id="s3btn" style="left: 976px; top: 419px; width: 186px; height: 60px;"></div>
            <div class="pointer" id="s3ptr" style="left: 1148px; top: 471px;"></div>
            <div class="hl" id="s3grid" style="left: 588px; top: 539px; width: 962px; height: 210px; border-radius: 8px;"></div>
          </div>
        </div>
        <div class="cap" id="s3cap">Stills at the spacing you set</div>
      </section>

      <section id="s4" class="scene clip" data-start="24.5" data-duration="7.5" data-track-index="0">
        <div class="frame">
          <div class="stage" id="s4stage" data-layout-allow-overflow>
            <img src="assets/after.png" alt="Save All on extracted frames" />
            <div class="hl" id="s4save" style="left: 1352px; top: 486px; width: 132px; height: 46px; border-radius: 8px;"></div>
            <div class="pointer" id="s4ptr" style="left: 1472px; top: 524px;"></div>
          </div>
        </div>
        <div class="cap" id="s4cap">Save one, or save all</div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const later = { immediateRender: false };
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#s0", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.0);
      tl.fromTo("#s0stage", { scale: 1.0, x: 0, y: 0 }, { scale: 1.28, x: 380, y: -36, duration: 4.5, ease: "none" }, 0.0);
      tl.fromTo("#s0soon", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.85);
      tl.fromTo("#s0soon", { opacity: 1 }, { opacity: 0.45, duration: 0.55, ease: "sine.inOut", ...later }, 1.4);
      tl.fromTo("#s0soon", { opacity: 0.45 }, { opacity: 1, duration: 0.55, ease: "sine.inOut", ...later }, 1.95);
      tl.fromTo("#s0soon", { opacity: 1 }, { opacity: 0.45, duration: 0.55, ease: "sine.inOut", ...later }, 2.5);
      tl.fromTo("#s0soon", { opacity: 0.45 }, { opacity: 1, duration: 0.55, ease: "sine.inOut", ...later }, 3.05);
      tl.fromTo("#s0", { opacity: 1 }, { opacity: 0, duration: 0.4, ...later }, 4.15);

      tl.fromTo("#s1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.5);
      tl.fromTo("#s1stage", { scale: 1.04, x: -20, y: 8 }, { scale: 1.16, x: 24, y: 56, duration: 6.0, ease: "none" }, 4.5);
      tl.fromTo("#s1cap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 4.85);
      tl.fromTo("#s1btn", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 5.4);
      tl.fromTo("#s1ptr", { opacity: 0, x: 22, y: 16 }, { opacity: 1, x: 0, y: 0, duration: 0.45, ease: "power2.out" }, 5.7);
      tl.fromTo("#s1cap", { opacity: 1, y: 0 }, { opacity: 0, y: 0, duration: 0.3, ...later }, 10.15);
      tl.fromTo("#s1", { opacity: 1 }, { opacity: 0, duration: 0.4, ...later }, 10.15);

      tl.fromTo("#s2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.5);
      tl.fromTo("#s2stage", { scale: 1.2, x: 0, y: 92 }, { scale: 1.12, x: 0, y: -124, duration: 6.6, ease: "power1.inOut" }, 10.5);
      tl.fromTo("#s2cap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 10.9);
      tl.fromTo("#s2preview", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 11.0);
      tl.fromTo("#s2preview", { opacity: 1 }, { opacity: 0, duration: 0.35, ...later }, 13.2);
      tl.fromTo("#s2settings", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 13.4);
      tl.fromTo("#s2cap", { opacity: 1, y: 0 }, { opacity: 0, y: 0, duration: 0.3, ...later }, 17.15);
      tl.fromTo("#s2", { opacity: 1 }, { opacity: 0, duration: 0.4, ...later }, 17.15);

      tl.fromTo("#s3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 17.5);
      tl.fromTo("#s3stage", { scale: 1.18, x: 0, y: 48 }, { scale: 1.14, x: 0, y: -92, duration: 6.6, ease: "power1.inOut" }, 17.5);
      tl.fromTo("#s3cap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 17.9);
      tl.fromTo("#s3btn", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 18.2);
      tl.fromTo("#s3ptr", { opacity: 0, x: 18, y: 14 }, { opacity: 1, x: 0, y: 0, duration: 0.4, ease: "power2.out" }, 18.5);
      tl.fromTo("#s3btn", { opacity: 1 }, { opacity: 0, duration: 0.3, ...later }, 20.4);
      tl.fromTo("#s3ptr", { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: 0, y: 0, duration: 0.25, ...later }, 20.4);
      tl.fromTo("#s3grid", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 20.6);
      tl.fromTo("#s3cap", { opacity: 1, y: 0 }, { opacity: 0, y: 0, duration: 0.3, ...later }, 24.15);
      tl.fromTo("#s3", { opacity: 1 }, { opacity: 0, duration: 0.4, ...later }, 24.15);

      tl.fromTo("#s4", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 24.5);
      tl.fromTo("#s4stage", { scale: 1.24, x: -200, y: -64 }, { scale: 1.0, x: 0, y: 0, duration: 6.8, ease: "power2.inOut" }, 24.5);
      tl.fromTo("#s4cap", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4 }, 24.85);
      tl.fromTo("#s4save", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 25.15);
      tl.fromTo("#s4ptr", { opacity: 0, x: 16, y: 12 }, { opacity: 1, x: 0, y: 0, duration: 0.4, ease: "power2.out" }, 25.4);
      tl.fromTo("#s4save", { opacity: 1 }, { opacity: 0, duration: 0.4, ...later }, 28.2);
      tl.fromTo("#s4ptr", { opacity: 1, x: 0, y: 0 }, { opacity: 0, x: 0, y: 0, duration: 0.3, ...later }, 28.2);
      tl.fromTo("#s4cap", { opacity: 1, y: 0 }, { opacity: 0, y: 0, duration: 0.4, ...later }, 29.0);
      tl.fromTo("#s4", { opacity: 1 }, { opacity: 1, duration: 0.01, ...later }, 31.99);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
