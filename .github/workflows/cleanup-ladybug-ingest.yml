name: cleanup-ladybug-ingest
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-ladybug-ingest.yml"
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove leftover ingest scaffolding
        run: |
          git config user.name "Matt Van Horn"
          git config user.email "mvanhorn@users.noreply.github.com"
          for attempt in 0 1 2 3 4 5 6 7; do
            git fetch origin main
            git reset --hard origin/main
            if [ ! -d _render/ladybug-list-min-max ]; then
              echo already clean
              if [ -f .github/workflows/cleanup-ladybug-ingest.yml ]; then
                git rm -f .github/workflows/cleanup-ladybug-ingest.yml
                git commit -m "Remove leftover ladybug ingest cleanup workflow" || true
                git pull --rebase origin main && git push origin HEAD:main && exit 0
              fi
              exit 0
            fi
            git rm -r -f _render/ladybug-list-min-max
            if [ -f .github/workflows/cleanup-ladybug-ingest.yml ]; then
              git rm -f .github/workflows/cleanup-ladybug-ingest.yml
            fi
            git commit -m "Remove leftover ladybug list-min-max ingest scaffolding"
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          exit 1
