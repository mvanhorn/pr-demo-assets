name: Decode 1195 demo binaries

on:
  push:
    paths:
      - "awesome-llm-apps/1195/*.b64.*"

jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 chunks into gif and mp4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          d = Path("awesome-llm-apps/1195")
          for name in ("preview.gif", "out.mp4"):
              parts = sorted(d.glob(name + ".b64.*"))
              if not parts:
                  continue
              blob = "".join(p.read_text().strip() for p in parts)
              (d / name).write_bytes(base64.b64decode(blob))
              for p in parts:
                  p.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A awesome-llm-apps/1195
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add awesome-llm-apps/1195 HyperFrames preview binaries"
          git push
