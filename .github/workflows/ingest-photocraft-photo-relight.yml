name: ingest-photocraft-photo-relight
on:
  push:
    paths:
      - ".github/workflows/ingest-photocraft-photo-relight.yml"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch rendered demo assets
        run: |
          set -euo pipefail
          mkdir -p photocraft/photo-relight
          curl -fL --retry 5 --retry-delay 2 -o photocraft/photo-relight/demo.gif \
            "https://litter.catbox.moe/a676s2.gif"
          curl -fL --retry 5 --retry-delay 2 -o photocraft/photo-relight/demo.mp4 \
            "https://litter.catbox.moe/l6xlun.mp4"
          python3 - <<'PY'
          import hashlib, pathlib
          files = {
            "photocraft/photo-relight/demo.gif": "d103b463a62e035b894f072c2a44ab5576d01d356c06a766f719ad3702a631c6",
            "photocraft/photo-relight/demo.mp4": "b16db88d94a699e931388d391c917e9d0dc880c9ade3dad7383f1f0b94751d7a",
          }
          for path, expected in files.items():
            digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
            assert digest == expected, (path, digest, expected)
            print(path, digest, pathlib.Path(path).stat().st_size)
          PY
          test "$(stat -c%s photocraft/photo-relight/demo.gif)" -lt 8000000
      - name: Commit assets and remove ingest workflow
        run: |
          set -euo pipefail
          git config user.name "Matt Van Horn"
          git config user.email "mvanhorn@users.noreply.github.com"
          git rm -f .github/workflows/ingest-photocraft-photo-relight.yml
          git add photocraft/photo-relight/demo.gif photocraft/photo-relight/demo.mp4
          git commit --author="Matt Van Horn <mvanhorn@users.noreply.github.com>" -m "Add photocraft Relight walkthrough GIF and MP4"
          git push
