name: place-ax-369-370
on:
  push:
    paths:
      - ".github/workflows/place-ax-369-370.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: place-ax-369-370
  cancel-in-progress: true
jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download demo assets, verify, and commit
        run: |
          set -euo pipefail
          fetch() {
            # $1 = landing path (id/name), $2 = destination, $3 = expected sha256
            local landing="https://tmpfiles.org/dl/$1"
            local direct
            direct=$(curl -fsSL -A "Mozilla/5.0" "$landing" | grep -oE "https://tmpfiles.org/dl/[0-9.a-f]+/$1" | head -1)
            if [ -z "$direct" ]; then direct="$landing"; fi
            curl -fL --retry 5 --retry-delay 2 -A "Mozilla/5.0" "$direct" -o "$2"
            echo "$3  $2" | sha256sum -c -
          }
          mkdir -p ax/369 ax/370
          fetch w8wyEeYgpQbS/ax-369-actortemplate-demo.png ax/369/actortemplate-demo.png c7244a46c82215a582316b2173d6c2039d40c81f8148aaba5b3664535aed531d
          fetch wVwfERYWpJj5/ax-369-tests.png                ax/369/tests.png              8eac60acc69ec7c38b06702187f4be653f03978dd77e02043fcb49b6f30ca919
          fetch w1wfEsYupE3I/ax-370-apply-demo.png           ax/370/apply-demo.png         39aa98337a4f23fdc99e04e3ffe07f5bba1cba2bcf9ce7ce8569a0a75bb69990
          fetch wPwiEeYlpn1h/ax-370-tests.png                ax/370/tests.png              c30be88bbe81088b15af4fbaa25054abf46d533def02b616641856154ec50aa1
          rm -f .github/workflows/place-ax-369-370.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ax/369 ax/370
          git add -u .github/workflows/place-ax-369-370.yml || true
          git status
          git commit -m "Add ax/369 and ax/370 demo assets"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || true
            sleep $((i * 2))
          done
          exit 1
