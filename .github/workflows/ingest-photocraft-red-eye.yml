name: ingest-photocraft-red-eye
on:
  push:
    paths:
      - ".github/workflows/ingest-photocraft-red-eye.yml"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install render deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet pillow
      - name: Decode sources, generate assets, render
        working-directory: _render/photocraft-red-eye-tool
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import base64,hashlib; root=Path("."); html="".join(((root/"index.html.b64.a").read_text()+(root/"index.html.b64.b").read_text()).split()); hb=base64.b64decode(html); assert hashlib.sha256(hb).hexdigest()=="f71cb5ef9e6c76568ba3170744162265fb3c444064b4667d38a7123e61dd546a", hashlib.sha256(hb).hexdigest(); (root/"index.html").write_bytes(hb); py="".join((root/"scripts/gen_assets.py.b64").read_text().split()); pb=base64.b64decode(py); assert hashlib.sha256(pb).hexdigest()=="ea8b8b7dd342ee7e129738e83583ff6d888ed0a42921dacca07e88c4b87eb9c4", hashlib.sha256(pb).hexdigest(); (root/"scripts").mkdir(parents=True, exist_ok=True); (root/"scripts/gen_assets.py").write_bytes(pb); print("decoded", len(hb), len(pb))'
          python3 scripts/gen_assets.py
          npx --yes hyperframes@0.8.140 browser ensure
          npx --yes hyperframes@0.8.140 render --format mp4 --output out.mp4 --workers 1 --no-browser-gpu
          ffmpeg -y -i out.mp4 -vf "fps=12,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" preview.gif
          npx --yes hyperframes@0.8.140 snapshot --at 11.2,18.0,32.5 --no-end --timeout 60000 --output snapshots
          ls -la snapshots || true
          if [ -d snapshots ]; then
            fly=$(ls snapshots | awk '/11[._]2/ {print; exit}')
            before=$(ls snapshots | awk '/18([._]0)?/ {print; exit}')
            after=$(ls snapshots | awk '/32[._]5/ {print; exit}')
            test -n "$fly" && cp "snapshots/$fly" red_eye_toolbar_flyout.png
            test -n "$before" && cp "snapshots/$before" red_eye_before.png
            test -n "$after" && cp "snapshots/$after" red_eye_after.png
          fi
          if [ ! -s red_eye_toolbar_flyout.png ]; then
            ffmpeg -y -ss 11.2 -i out.mp4 -update 1 -frames:v 1 red_eye_toolbar_flyout.png
          fi
          if [ ! -s red_eye_before.png ]; then
            ffmpeg -y -ss 18.0 -i out.mp4 -update 1 -frames:v 1 red_eye_before.png
          fi
          if [ ! -s red_eye_after.png ]; then
            ffmpeg -y -ss 32.5 -i out.mp4 -update 1 -frames:v 1 red_eye_after.png
          fi
          test -s out.mp4
          test -s preview.gif
          test -s red_eye_toolbar_flyout.png
          test -s red_eye_before.png
          test -s red_eye_after.png
          test "$(stat -c%s preview.gif)" -lt 8000000
      - name: Commit assets and remove ingest files
        run: |
          set -euo pipefail
          git config user.name "Matt Van Horn"
          git config user.email "mvanhorn@users.noreply.github.com"
          mkdir -p photocraft/red-eye-tool
          cp _render/photocraft-red-eye-tool/preview.gif photocraft/red-eye-tool/demo.gif
          cp _render/photocraft-red-eye-tool/out.mp4 photocraft/red-eye-tool/demo.mp4
          cp _render/photocraft-red-eye-tool/red_eye_toolbar_flyout.png photocraft/red-eye-tool/
          cp _render/photocraft-red-eye-tool/red_eye_before.png photocraft/red-eye-tool/
          cp _render/photocraft-red-eye-tool/red_eye_after.png photocraft/red-eye-tool/
          git rm -rf --ignore-unmatch ingest/red-eye _render/photocraft-red-eye-tool
          git rm -f .github/workflows/ingest-photocraft-red-eye.yml
          git add photocraft/red-eye-tool/demo.gif photocraft/red-eye-tool/demo.mp4 photocraft/red-eye-tool/red_eye_toolbar_flyout.png photocraft/red-eye-tool/red_eye_before.png photocraft/red-eye-tool/red_eye_after.png
          git commit --author="Matt Van Horn <mvanhorn@users.noreply.github.com>" -m "Add photocraft Red Eye walkthrough GIF, MP4, and screenshots"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
          done
          exit 1
