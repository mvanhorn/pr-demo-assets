name: place-ax-405-406
on:
  push:
    paths:
      - ".github/workflows/place-ax-405-406.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: place-ax-405-406
  cancel-in-progress: true
jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download demo assets, verify, and commit
        run: |
          set -euo pipefail
          fetch() {
            # $1 = id/name, $2 = destination, $3 = expected sha256
            local landing="https://tmpfiles.org/dl/$1"
            local direct
            direct=$(curl -fsSL -A "Mozilla/5.0" "$landing" | grep -oE "https://tmpfiles.org/dl/[0-9.a-f]+/$1" | head -1)
            if [ -z "$direct" ]; then direct="$landing"; fi
            curl -fL --retry 5 --retry-delay 2 -A "Mozilla/5.0" "$direct" -o "$2"
            echo "$3  $2" | sha256sum -c -
          }
          mkdir -p ax/405 ax/406
          fetch wQw6EN1BFnBc/ax-405-preview.gif ax/405/preview.gif 47b721439b38588c28a62c6b66e13668412e4e5229bc5a8994f48a271967afa0
          fetch wtw3Ef1kFYk4/ax-405-out.mp4 ax/405/out.mp4 5c4fabcbe1baafa0dfdb36dd8eda9eba6824b8347a898a095ff564339e369ac7
          fetch wkwfEj1cFI4q/ax-406-preview.gif ax/406/preview.gif 3ebc258d921babd755e9a8acd64723666999e30df916cb0b7ede6a4b4e0afa74
          fetch w2wkEj1nFxmP/ax-406-out.mp4 ax/406/out.mp4 37f92620eac1f525c6ecd6a7e208c83f8180401ddfe444219528904353d00b34
          rm -f .github/workflows/place-ax-405-406.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ax/405 ax/406
          git add -u .github/workflows/place-ax-405-406.yml || true
          git status
          git commit -m "Add ax/405 and ax/406 HyperFrames walkthroughs"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || true
            sleep $((i * 2))
          done
          exit 1
