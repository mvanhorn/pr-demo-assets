name: place-univer-evidence
on:
  push:
    paths:
      - ".github/workflows/place-univer-evidence.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: place-univer-evidence
  cancel-in-progress: true
jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download evidence images, verify, and commit
        run: |
          set -euo pipefail
          fetch() {
            # $1 = id/name, $2 = destination, $3 = expected sha256
            local landing="https://tmpfiles.org/dl/$1"
            local direct
            direct=$(curl -fsSL -A "Mozilla/5.0" "$landing" | grep -oE "https://tmpfiles.org/dl/[0-9.a-f]+/$1" | head -1)
            if [ -z "$direct" ]; then direct="$landing"; fi
            curl -fL --retry 5 --retry-delay 2 -A "Mozilla/5.0" "$direct" -o "$2"
            echo "$3  $2" | sha256sum -c -
          }
          mkdir -p univer/show-formulas univer/facade-menu-removal
          fetch wBweEcuQfyvr/show-formulas-1-values.png univer/show-formulas/show-formulas-1-values.png b360e111bd836da384851ebac3f0d5d1dd8129ebfa240b5875314b1b127e99b3
          fetch wdw1EUuFf6Yh/show-formulas-2-view-tab.png univer/show-formulas/show-formulas-2-view-tab.png c11953a13a042f5688ccb0a99f69496251ceff252fb73dee0be5f1f542bed3da
          fetch wJwEEWu8fMu9/show-formulas-3-enabled.png univer/show-formulas/show-formulas-3-enabled.png dee600f2215ba6ab825df60bcd305f01ea42b963cb84cad43815410c17bea55d
          fetch wVwmEMuMfNzj/show-formulas-4-shortcut.png univer/show-formulas/show-formulas-4-shortcut.png 1f44dab78436da91cd36635b2b6547488a23642d95b546efd0e72b3613451da0
          fetch w8wEEauOfgiC/show-formulas-5-tests.png univer/show-formulas/show-formulas-5-tests.png d3797484fcabd639f87418007299df1a7cab879ba7522f5068af44052cc1f489
          fetch wrwNEXuofeFE/menu-removal-1-added.png univer/facade-menu-removal/menu-removal-1-added.png 2ef692232cc570056e2414bb677885127234dfb00fa937e178075aa0bf1f5c8b
          fetch wVwdE0u1fpO9/menu-removal-2-removed.png univer/facade-menu-removal/menu-removal-2-removed.png 0764b8d6ac04fd2ff8b0b3c17bc889cd2efdcb5e9a478081a6f82d05d318904f
          fetch wfw1ETu8fKDn/menu-removal-3-tests.png univer/facade-menu-removal/menu-removal-3-tests.png f8fc639d5a0119970a3ddd5a356e8846a539f0ed493642adea4d758faae573d1
          rm -f .github/workflows/place-univer-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add univer/show-formulas univer/facade-menu-removal
          git add -u .github/workflows/place-univer-evidence.yml || true
          git status
          git commit -m "Add univer/show-formulas and univer/facade-menu-removal evidence"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || true
            sleep $((i * 2))
          done
          exit 1
