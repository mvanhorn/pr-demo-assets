name: ingest-rea-analysis-view
on:
  push:
    paths:
      - ".github/workflows/ingest-rea-analysis-view.yml"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render and ingest rea analysis-view walkthrough
        env:
          GIT_AUTHOR_NAME: Matt Van Horn
          GIT_AUTHOR_EMAIL: mvanhorn@users.noreply.github.com
          GIT_COMMITTER_NAME: Matt Van Horn
          GIT_COMMITTER_EMAIL: mvanhorn@users.noreply.github.com
        run: |
          set -euo pipefail
          python3 _render/rea-analysis-view/boot.py
# rerun-1
