name: place-univer-walkthroughs
on:
  push:
    paths:
      - ".github/workflows/place-univer-walkthroughs.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: place-univer-walkthroughs
  cancel-in-progress: true
jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download demo assets, verify, and commit
        run: |
          set -euo pipefail
          fetch() {
            # $1 = landing page, $2 = destination, $3 = expected sha256
            local direct
            direct=$(curl -fsSL -A "Mozilla/5.0" "$1" | grep -oE 'https://tmpfiles.org/dl/[^" ]+' | head -1)
            if [ -z "$direct" ]; then
              echo "no direct url in $1" >&2
              exit 1
            fi
            curl -fL --retry 5 --retry-delay 2 -A "Mozilla/5.0" "$direct" -o "$2"
            echo "$3  $2" | sha256sum -c -
          }
          mkdir -p univer/3236 univer/6758
          fetch "https://tmpfiles.org/w6wGE6uy9AqG/preview.gif" univer/3236/preview.gif c437ebdfd8c02d5d2b8fa58ade9731f9f3921e3916a5f7661bf57f3ab4fd45f8
          fetch "https://tmpfiles.org/wgwXEPu69eN1/out.mp4" univer/3236/out.mp4 1cb698911d020a503ac851c110b71cc3d8b16cc278e9922f4ec141611b6d8d9a
          fetch "https://tmpfiles.org/w5wVEruj9Ox9/preview.gif" univer/6758/preview.gif d068019aa0fd7a8aa2059eccebbd78795394d5762d033cc688ff865f4a555d71
          fetch "https://tmpfiles.org/wPw1EXuK9nEj/out.mp4" univer/6758/out.mp4 4c5c7d2422efbd38629a2a6b86c241c6d521919fa20cc2c8bda96eb6876171fb
          rm -f .github/workflows/place-univer-walkthroughs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add univer/3236/preview.gif univer/3236/out.mp4 univer/6758/preview.gif univer/6758/out.mp4
          git add -u .github/workflows/place-univer-walkthroughs.yml || true
          git status
          git commit -m "Add univer/3236 and univer/6758 HyperFrames walkthroughs"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || true
            sleep $((i * 2))
          done
          exit 1
