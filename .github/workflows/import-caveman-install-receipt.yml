name: import-caveman-install-receipt
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-caveman-install-receipt.yml"
permissions:
  contents: write
concurrency:
  group: import-caveman-install-receipt
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify, commit binaries, and self-delete
        env:
          GIF_PAGE: https://tmpfiles.org/wjAseyI6KQ4G/preview.gif
          MP4_PAGE: https://tmpfiles.org/wIAPeuIwZIQU/out.mp4
          GIF_DIRECT: https://d.uguu.se/zsWcEfuJ.gif
          MP4_DIRECT: https://d.uguu.se/MDFBfYCg.mp4
          GIF_DL: https://tmpfiles.org/dl/1790994702.ae36c509e8d5105b/wjAseyI6KQ4G/preview.gif
          MP4_DL: https://tmpfiles.org/dl/1790994707.fa00338e1b20a4a9/wIAPeuIwZIQU/out.mp4
          GIF_SHA: a26b392eea1bec5a63716c0efe2e47768febc270b54a6cabe2000de821bca98c
          MP4_SHA: 7ab657bc7cc92eb9dcc2b90e39c87a17d5ab137275fcc7a817d24dda1757e8e1
        run: |
          set -euo pipefail
          mkdir -p caveman/install-receipt
          python3 << 'PY'
          import os, re, urllib.request, pathlib, hashlib, ssl
          ua = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36"}
          dest_gif = pathlib.Path("caveman/install-receipt/preview.gif")
          dest_mp4 = pathlib.Path("caveman/install-receipt/out.mp4")
          ctx = ssl.create_default_context()

          def get(url):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=180, context=ctx) as r:
                  return r.read()

          def looks_html(data):
              head = data[:200].lstrip().lower()
              return head.startswith(b"<!doctype") or head.startswith(b"<html")

          def fetch_one(urls, dest, expect_magic):
              last = None
              for url in urls:
                  try:
                      print("GET", url)
                      data = get(url)
                      if looks_html(data):
                          html = data.decode("utf-8", "replace")
                          m = re.search(r'https://tmpfiles.org/dl/[^"\'\\s]+', html)
                          if not m:
                              raise RuntimeError("html without dl link")
                          print("follow", m.group(0))
                          data = get(m.group(0))
                      if not data.startswith(expect_magic):
                          raise RuntimeError(f"bad magic {data[:16]!r}")
                      dest.write_bytes(data)
                      print(dest, len(data), hashlib.sha256(data).hexdigest())
                      return
                  except Exception as e:
                      last = e
                      print("fail", url, e)
              raise RuntimeError(f"all sources failed for {dest}: {last}")

          fetch_one(
              [os.environ["GIF_DIRECT"], os.environ["GIF_DL"], os.environ["GIF_PAGE"]],
              dest_gif,
              b"GIF",
          )
          fetch_one(
              [os.environ["MP4_DIRECT"], os.environ["MP4_DL"], os.environ["MP4_PAGE"]],
              dest_mp4,
              b"\x00\x00\x00",
          )

          gif = dest_gif.read_bytes()
          mp4 = dest_mp4.read_bytes()
          if hashlib.sha256(gif).hexdigest() != os.environ["GIF_SHA"]:
              raise SystemExit("gif sha256 mismatch")
          if hashlib.sha256(mp4).hexdigest() != os.environ["MP4_SHA"]:
              raise SystemExit("mp4 sha256 mismatch")
          print("checksums ok")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf caveman/install-receipt/_import || true
          rm -f .github/workflows/import-caveman-install-receipt.yml
          git add caveman/install-receipt/preview.gif caveman/install-receipt/out.mp4
          git add -u .github/workflows/import-caveman-install-receipt.yml || true
          git add -u caveman/install-receipt/_import || true
          git status
          git diff --cached --quiet && echo "no binary changes" && exit 0
          git commit -m "Add caveman/install-receipt preview.gif and out.mp4"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((i * 3))
            git pull --rebase origin main || true
          done
          exit 1
