name: probe-actions
on: push:
  paths:
    - ".github/workflows/probe-actions.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "Matt Van Horn"
          git config user.email "mvanhorn@users.noreply.github.com"
          printf 'GIF89a' > holmesgpt/doctor-cli/_probe-actions.bin
          git add holmesgpt/doctor-cli/_probe-actions.bin
          git commit -m "probe: actions write" || true
          git push || true
          rm -f .github/workflows/probe-actions.yml
          git add .github/workflows/probe-actions.yml
          git commit -m "probe: remove actions probe workflow" || true
          git push || true
