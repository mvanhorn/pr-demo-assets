name: ingest-photocraft-rotate-view
on:
  push:
    paths:
      - ".github/workflows/ingest-photocraft-rotate-view.yml"
      - "_render/photocraft-rotate-view/**"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: Matt Van Horn
      GIT_AUTHOR_EMAIL: mvanhorn@users.noreply.github.com
      GIT_COMMITTER_NAME: Matt Van Horn
      GIT_COMMITTER_EMAIL: mvanhorn@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode and commit assets
        run: python3 _render/photocraft-rotate-view/ingest.py
