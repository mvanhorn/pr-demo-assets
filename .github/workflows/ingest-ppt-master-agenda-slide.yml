name: ingest-ppt-master-agenda-slide
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-ppt-master-agenda-slide.yml"
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble demo GIF and MP4
        run: python3 _render/ppt-master-agenda-slide/boot.py
