name: Publish agent-native 5465
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-agent-native-5465.yml"
      - "agent-native/5465/staging.json"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and commit binaries
        env:
          GIF_PAGE: https://tmpfiles.org/wOwUxNyh2jEa/preview.gif
          MP4_PAGE: https://tmpfiles.org/wWw6x7yDGD0H/out.mp4
          GIF_DIRECT: https://d.uguu.se/CYlSHdEd.gif
          MP4_DIRECT: https://n.uguu.se/UGdpWlcN.mp4
          GIF_DL: https://tmpfiles.org/dl/1789923801.51871fb058d36d54/wOwUxNyh2jEa/preview.gif
          MP4_DL: https://tmpfiles.org/dl/1789923818.a5833660403fa0c1/wWw6x7yDGD0H/out.mp4
          GIF_SHA: b2ffb82ccccee2def18aae62510e3932076cfb6c16283183b7c32295b1c60d8d
          MP4_SHA: d7fac9a7e4802be4e7fc8ff52bffcf95f9018d43b3df8055fd4fefec7893fa3a
        run: |
          set -euo pipefail
          mkdir -p agent-native/5465
          python3 << 'PY'
          import os, re, urllib.request, pathlib, hashlib, json, base64, ssl
          ua = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36"}
          dest_gif = pathlib.Path("agent-native/5465/preview.gif")
          dest_mp4 = pathlib.Path("agent-native/5465/out.mp4")
          ctx = ssl.create_default_context()

          def get(url):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=180, context=ctx) as r:
                  return r.read()

          def looks_html(data):
              head = data[:200].lstrip().lower()
              return head.startswith(b"<!doctype") or head.startswith(b"<html")

          def fetch_one(urls, dest, expect_magic):
              last = None
              for url in urls:
                  try:
                      print("GET", url)
                      data = get(url)
                      if looks_html(data):
                          html = data.decode("utf-8", "replace")
                          m = re.search(r'https://tmpfiles.org/dl/[^"\'\\s]+', html)
                          if not m:
                              raise RuntimeError("html without dl link")
                          print("follow", m.group(0))
                          data = get(m.group(0))
                      if not data.startswith(expect_magic):
                          raise RuntimeError(f"bad magic {data[:16]!r}")
                      dest.write_bytes(data)
                      print(dest, len(data), hashlib.sha256(data).hexdigest())
                      return
                  except Exception as e:
                      last = e
                      print("fail", url, e)
              raise RuntimeError(f"all sources failed for {dest}: {last}")

          staging = pathlib.Path("agent-native/5465/staging.json")
          if staging.exists():
              spec = json.loads(staging.read_text())
              for item in spec.get("files", []):
                  parts = [pathlib.Path(p).read_text().strip() for p in item["parts"]]
                  data = base64.b64decode("".join(parts))
                  out = pathlib.Path(item["path"])
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)
                  print("decoded", out, len(data), hashlib.sha256(data).hexdigest())
          else:
              fetch_one(
                  [os.environ["GIF_DIRECT"], os.environ["GIF_DL"], os.environ["GIF_PAGE"]],
                  dest_gif,
                  b"GIF",
              )
              fetch_one(
                  [os.environ["MP4_DIRECT"], os.environ["MP4_DL"], os.environ["MP4_PAGE"]],
                  dest_mp4,
                  b"\x00\x00\x00",
              )

          gif = dest_gif.read_bytes()
          mp4 = dest_mp4.read_bytes()
          if hashlib.sha256(gif).hexdigest() != os.environ["GIF_SHA"]:
              raise SystemExit("gif sha256 mismatch")
          if hashlib.sha256(mp4).hexdigest() != os.environ["MP4_SHA"]:
              raise SystemExit("mp4 sha256 mismatch")
          print("checksums ok")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f agent-native/5465/.keep || true
          git add agent-native/5465/preview.gif agent-native/5465/out.mp4
          git status
          git diff --cached --quiet && echo "no binary changes" && exit 0
          git commit -m "Add agent-native#5465 HyperFrames preview.gif and out.mp4"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            sleep $((i * 3))
            git rebase --abort || true
            git pull --rebase origin main || true
          done
