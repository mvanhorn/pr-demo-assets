name: place-ecc-3188
on:
  push:
    paths:
      - ".github/workflows/place-ecc-3188.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: place-ecc-3188
  cancel-in-progress: true
jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download demo assets and commit
        run: |
          set -euo pipefail
          GIF_URL='https://tmpfiles.org/dl/1789924796.6606a12af3a0b6fc/wKwXxAtyV5OE/preview.gif'
          MP4_URL='https://tmpfiles.org/dl/1789924814.9dc3550b40e491a1/wCwFxWtKVyCL/out.mp4'
          mkdir -p ECC/3188
          curl -fL --retry 5 --retry-delay 2 -A "Mozilla/5.0" "$GIF_URL" -o ECC/3188/preview.gif
          curl -fL --retry 5 --retry-delay 2 -A "Mozilla/5.0" "$MP4_URL" -o ECC/3188/out.mp4
          python3 - <<'PY'
          from pathlib import Path
          g = Path("ECC/3188/preview.gif").read_bytes()
          m = Path("ECC/3188/out.mp4").read_bytes()
          assert g[:6] == b"GIF89a", g[:16]
          assert m[4:8] == b"ftyp", m[:16]
          print("gif", len(g), "mp4", len(m))
          PY
          rm -f .github/workflows/place-ecc-3188.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ECC/3188/preview.gif ECC/3188/out.mp4
          git add -u .github/workflows/place-ecc-3188.yml || true
          git status
          git commit -m "Add ECC/3188 HyperFrames skill host-compat demo"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || true
            sleep $((i * 2))
          done
          exit 1
