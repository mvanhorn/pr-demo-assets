name: ingest-holmesgpt-doctor-cli-bytes
on:
  push:
    paths:
      - ".github/workflows/ingest-holmesgpt-doctor-cli-bytes.yml"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DOCTOR_BYTES_BASE: https://silly-rabbits-pull.loca.lt
      GIT_AUTHOR_NAME: Matt Van Horn
      GIT_AUTHOR_EMAIL: mvanhorn@users.noreply.github.com
      GIT_COMMITTER_NAME: Matt Van Horn
      GIT_COMMITTER_EMAIL: mvanhorn@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch exact demo bytes and commit
        run: python3 _render/holmesgpt-doctor-cli-bytes/ingest.py
