name: place-caveman-session-token-budget
on:
  push:
    paths:
      - ".github/workflows/place-caveman-session-token-budget.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: place-caveman-session-token-budget
  cancel-in-progress: true
jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download demo assets, verify, and commit
        run: |
          set -euo pipefail
          fetch() {
            local direct
            direct=$(curl -fsSL -A "Mozilla/5.0" "$1" | grep -oE 'https://tmpfiles.org/dl/[^" ]+' | head -1)
            if [ -z "$direct" ]; then
              echo "no direct url in $1" >&2
              exit 1
            fi
            curl -fL --retry 5 --retry-delay 2 -A "Mozilla/5.0" "$direct" -o "$2"
            echo "$3  $2" | sha256sum -c -
          }
          mkdir -p caveman/session-token-budget
          fetch "https://tmpfiles.org/w9AjeGRJ8IHl/preview.gif" caveman/session-token-budget/preview.gif 06036b8fc9207f079fbb12882641b12bdb4283efbbbd957195465f05496366af
          fetch "https://tmpfiles.org/wzAPeWRD8tW2/out.mp4" caveman/session-token-budget/out.mp4 4c940879184c5f277d4205b4d91cec6a783ed572138dc1393ab81ddeb0718430
          rm -f .github/workflows/place-caveman-session-token-budget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add caveman/session-token-budget/preview.gif caveman/session-token-budget/out.mp4
          git add -u .github/workflows/place-caveman-session-token-budget.yml || true
          git status
          git commit -m "Add caveman/session-token-budget HyperFrames walkthrough"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || true
            sleep $((i * 2))
          done
          exit 1
