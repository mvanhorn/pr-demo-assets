name: place-substrate-1750-1040
on:
  push:
    paths:
      - ".github/workflows/place-substrate-1750-1040.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: place-substrate-1750-1040
  cancel-in-progress: true
jobs:
  place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download demo assets, verify, and commit
        run: |
          set -euo pipefail
          fetch() {
            # $1 = id/name, $2 = destination, $3 = expected sha256
            local landing="https://tmpfiles.org/dl/$1"
            local direct
            direct=$(curl -fsSL -A "Mozilla/5.0" "$landing" | grep -oE "https://tmpfiles.org/dl/[0-9.a-f]+/$1" | head -1)
            if [ -z "$direct" ]; then direct="$landing"; fi
            curl -fL --retry 5 --retry-delay 2 -A "Mozilla/5.0" "$direct" -o "$2"
            echo "$3  $2" | sha256sum -c -
          }
          mkdir -p substrate/1750 substrate/1040
          fetch wiwcEn1EGEs1/preview.gif substrate/1750/preview.gif 777cb1fba0b4b644371e13d25bcb93d8dee9f892b7ea0f2d4f3b82a12989dc45
          fetch wwwxEB1aGHPC/out.mp4 substrate/1750/out.mp4 9d2c81ac90138b258bcdbec3bdaadb0ec1f7da6eb8f9d22091bf95d4df9addad
          fetch wHwFEK1eGVqB/preview.gif substrate/1040/preview.gif 7726ee522adc6ed66c6cdcaeb629045526abfdd3ecd6aa44602f52dd973c047d
          fetch wfwkEV1eGVxM/out.mp4 substrate/1040/out.mp4 c85683a0303344f87413a3827b4fcb416dead901a63a39e8cc2fa3511a3d09ce
          rm -f .github/workflows/place-substrate-1750-1040.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substrate/1750 substrate/1040
          git add -u .github/workflows/place-substrate-1750-1040.yml || true
          git status
          git commit -m "Add substrate/1750 and substrate/1040 HyperFrames walkthroughs"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main || true
            sleep $((i * 2))
          done
          exit 1
