name: ingest-at-mcp-search-posts-filters
on:
  push:
    paths:
      - ".github/workflows/ingest-at-mcp-search-posts-filters.yml"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: Matt Van Horn
      GIT_AUTHOR_EMAIL: mvanhorn@users.noreply.github.com
      GIT_COMMITTER_NAME: Matt Van Horn
      GIT_COMMITTER_EMAIL: mvanhorn@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render and commit demo
        run: python3 _render/at_mcp-search-posts-filters/ingest.py
