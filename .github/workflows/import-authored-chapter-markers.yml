name: import-authored-chapter-markers
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-authored-chapter-markers.yml"
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import binaries onto main
        run: |
          set -euo pipefail
          mkdir -p hyperframes/authored-chapter-markers
          curl -fsSL -o hyperframes/authored-chapter-markers/preview.gif "https://tmpfiles.org/dl/1790996594.0752636928d493c6/wtAIeOFgGp5L/preview.gif"
          curl -fsSL -o hyperframes/authored-chapter-markers/out.mp4 "https://tmpfiles.org/dl/1790996602.acec754ff64a4380/wQAYeZFhGfYr/out.mp4"
          test "$(wc -c < hyperframes/authored-chapter-markers/preview.gif)" -eq 799792
          test "$(wc -c < hyperframes/authored-chapter-markers/out.mp4)" -eq 773979
          file hyperframes/authored-chapter-markers/preview.gif | grep -q GIF
          file hyperframes/authored-chapter-markers/out.mp4 | grep -qiE 'ISO Media|MP4|MPEG'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hyperframes/authored-chapter-markers/preview.gif hyperframes/authored-chapter-markers/out.mp4
          git commit -m "Add HyperFrames authored chapter markers GIF and MP4"
          git push
