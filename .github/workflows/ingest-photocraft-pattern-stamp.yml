name: ingest-photocraft-pattern-stamp
on:
  push:
    paths:
      - ".github/workflows/ingest-photocraft-pattern-stamp.yml"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch rendered demo assets
        run: |
          set -euo pipefail
          mkdir -p photocraft/pattern-stamp
          curl -fL --retry 5 --retry-delay 2 -o photocraft/pattern-stamp/demo.gif \
            "https://h.uguu.se/DqkGfQwY.gif"
          curl -fL --retry 5 --retry-delay 2 -o photocraft/pattern-stamp/demo.mp4 \
            "https://d.uguu.se/PhBDlZwO.mp4"
          curl -fL --retry 5 --retry-delay 2 -o photocraft/pattern-stamp/before-clone-stamp.png \
            "https://h.uguu.se/viURJXzC.png"
          curl -fL --retry 5 --retry-delay 2 -o photocraft/pattern-stamp/after-flyout.png \
            "https://h.uguu.se/XtqqrjSe.png"
          curl -fL --retry 5 --retry-delay 2 -o photocraft/pattern-stamp/after-options.png \
            "https://n.uguu.se/NXQuZgdH.png"
          curl -fL --retry 5 --retry-delay 2 -o photocraft/pattern-stamp/after-stroke.png \
            "https://n.uguu.se/EgqgXPfJ.png"
          python3 - <<'PY'
          import hashlib, pathlib
          files = {
            "photocraft/pattern-stamp/demo.gif": "7a193ba57c36e4f70a4b6e8b2a6e7251cad80d86816f91d003f96aceaef90a8c",
            "photocraft/pattern-stamp/demo.mp4": "d01157f2c525efbfd76608d220a274d169d3eaf730c6089787f1310496541ab1",
            "photocraft/pattern-stamp/before-clone-stamp.png": "400b7a917534e718bf42fdd732dede8a7cedd86825409ea17ad9220b94ee9fa8",
            "photocraft/pattern-stamp/after-flyout.png": "99168e9cf265bfcda8f3d291925a575807c8271956be2189594cdb42ceb53b5f",
            "photocraft/pattern-stamp/after-options.png": "82d2aadbd428ae23851c37eeb8d2ccda06e20ef20f3bf1c9bcb9306bd8ade848",
            "photocraft/pattern-stamp/after-stroke.png": "da8a935323829aa9217d56c726fe57301c8d26dff4450bbfa989e15380498dae",
          }
          for path, expected in files.items():
            digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
            assert digest == expected, (path, digest, expected)
            print(path, digest, pathlib.Path(path).stat().st_size)
          PY
          test "$(stat -c%s photocraft/pattern-stamp/demo.gif)" -lt 8000000
      - name: Commit assets and remove ingest workflow
        run: |
          set -euo pipefail
          git config user.name "Matt Van Horn"
          git config user.email "mvanhorn@users.noreply.github.com"
          git rm -f .github/workflows/ingest-photocraft-pattern-stamp.yml
          git add photocraft/pattern-stamp/demo.gif photocraft/pattern-stamp/demo.mp4 photocraft/pattern-stamp/before-clone-stamp.png photocraft/pattern-stamp/after-flyout.png photocraft/pattern-stamp/after-options.png photocraft/pattern-stamp/after-stroke.png
          git commit --author="Matt Van Horn <mvanhorn@users.noreply.github.com>" -m "Add photocraft Pattern Stamp walkthrough GIF, MP4, and screenshots"
          git push
