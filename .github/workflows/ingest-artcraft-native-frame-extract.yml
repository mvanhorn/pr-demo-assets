name: ingest-artcraft-native-frame-extract
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ingest-artcraft-native-frame-extract.yml"
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble demo GIF, MP4, and stills
        run: python3 _render/artcraft-native-frame-extract/boot.py
