name: ingest-ladybug-list-has-any
on:
  push:
    paths:
      - ".github/workflows/ingest-ladybug-list-has-any.yml"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: Matt Van Horn
      GIT_AUTHOR_EMAIL: mvanhorn@users.noreply.github.com
      GIT_COMMITTER_NAME: Matt Van Horn
      GIT_COMMITTER_EMAIL: mvanhorn@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg and fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-dejavu
      - name: Render and commit demo
        run: python3 _render/ladybug-list-has-any/ingest.py
